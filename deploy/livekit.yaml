# livekit-server 生产配置（挂载到容器 /etc/livekit.yaml）
# 密钥不放在这里——由 compose 通过 LIVEKIT_KEYS 环境变量注入。

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

# 内嵌 TURN：公网部署必须，否则对称 NAT 后的客户端（手机 4G/企业网）打不通 UDP
turn:
  enabled: true
  udp_port: 3478
  # 有域名+证书后取消注释，走 TURN/TLS（抗封锁最强）
  # domain: your-domain.example.com
  # tls_port: 5349
  # external_tls: true

logging:
  level: info
