<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超脑 · 语音助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0d'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23e6ebff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --surface: rgba(255, 255, 255, 0.06);
    --surface-hover: rgba(255, 255, 255, 0.12);
    --line: rgba(255, 255, 255, 0.12);
    --txt: rgba(255, 255, 255, 0.92);
    --txt-2: rgba(255, 255, 255, 0.60);
    --txt-3: rgba(255, 255, 255, 0.38);
    --orb-hi: #ffffff;
    --orb-mid: #e6ebff;
    --orb-lo: #8ea2ff;
    --danger: #ff6b66;
    --energy: 0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--txt);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 60% at 50% 32%, rgba(96, 118, 255, 0.13), transparent 65%);
  }
  :focus-visible { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 3px; }
  ::selection { background: rgba(142, 162, 255, 0.35); }
  button { font-family: inherit; }

  /* ===== 顶栏 ===== */
  .topbar {
    position: relative; z-index: 20;
    height: 60px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, var(--orb-hi), var(--orb-mid) 45%, var(--orb-lo));
    box-shadow: 0 0 12px rgba(142, 162, 255, 0.5);
  }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface); color: var(--txt-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--txt); }
  .icon-btn svg { width: 18px; height: 18px; }
  .arch-link {
    font-size: 12px; color: var(--txt-3); text-decoration: none;
    padding: 6px 4px; transition: color .15s ease;
  }
  .arch-link:hover { color: var(--txt-2); }

  /* ===== 中央舞台 ===== */
  .stage-area {
    flex: 1; position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 28px; min-height: 0;
  }

  .stage { position: relative; width: 216px; height: 216px; flex: none; }
  .orb-glow {
    position: absolute; inset: -48px; border-radius: 50%;
    background: radial-gradient(circle, rgba(160, 180, 255, 0.55), rgba(120, 140, 255, 0.16) 55%, transparent 72%);
    filter: blur(28px);
    opacity: 0.4;
    transition: opacity .12s linear;
    pointer-events: none;
  }
  .orb-hit {
    position: absolute; inset: 0; border: none; background: none;
    border-radius: 50%; cursor: pointer; padding: 0;
  }
  .orb-scale {
    position: absolute; inset: 22px;
    transition: transform .1s linear;
    will-change: transform;
  }
  .orb-core {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, var(--orb-hi) 0%, var(--orb-mid) 34%, #b9c6ff 64%, var(--orb-lo) 100%);
    box-shadow:
      inset 0 -14px 32px rgba(80, 100, 220, 0.42),
      inset 0 10px 20px rgba(255, 255, 255, 0.85),
      0 12px 44px rgba(90, 110, 255, 0.35);
    animation: breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  .orb-sheen {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    background: conic-gradient(from 0deg, transparent 0deg 68%, rgba(255, 255, 255, 0.8) 84%, transparent 100%);
    mix-blend-mode: screen;
    opacity: 0;
    animation: sheen 3.4s linear infinite;
    transition: opacity .3s ease;
    pointer-events: none;
  }
  @keyframes sheen { to { transform: rotate(360deg); } }
  .stage.connecting .orb-sheen { opacity: 0.55; animation-duration: 2.2s; }
  .stage.thinking .orb-sheen { opacity: 0.85; animation-duration: 1.3s; }
  .stage.off .orb-core { animation-play-state: paused; filter: saturate(0.4) brightness(0.75); }
  .stage.off .orb-glow { opacity: 0.15; }

  /* ===== 状态文字 ===== */
  .status {
    margin-top: 34px; min-height: 24px;
    font-size: 16.5px; font-weight: 500; letter-spacing: 0.01em;
    color: var(--txt); text-align: center;
    transition: color .2s ease;
  }
  .status.dim { color: var(--txt-3); font-weight: 400; }
  .hint {
    margin-top: 8px; min-height: 18px;
    font-size: 13px; color: var(--txt-3); text-align: center;
  }

  /* ===== 字幕（居中淡入） ===== */
  .caption {
    margin-top: 22px; max-width: 540px; min-height: 30px;
    font-size: 16px; line-height: 1.65; text-align: center;
    color: var(--txt-2);
    transition: opacity .3s ease;
  }
  .caption:empty { opacity: 0; }
  .caption .who { color: var(--txt-3); font-size: 12px; letter-spacing: 0.1em; display: block; margin-bottom: 2px; }

  /* ===== 空闲动作区（CTA + 建议） ===== */
  .idle-actions {
    margin-top: 36px;
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    transition: opacity .3s ease, transform .3s ease;
  }
  .idle-actions.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; position: absolute; }
  .cta {
    border: none; cursor: pointer;
    background: #ffffff; color: #0a0a0d;
    font-size: 15.5px; font-weight: 600; letter-spacing: 0.02em;
    padding: 15px 40px; border-radius: 9999px;
    box-shadow: 0 2px 10px rgba(255,255,255,0.14), 0 8px 32px rgba(142,162,255,0.25);
    transition: transform .16s cubic-bezier(0.2, 0.6, 0.4, 1), box-shadow .2s ease, opacity .2s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(255,255,255,0.18), 0 12px 40px rgba(142,162,255,0.35); }
  .cta:active { transform: translateY(0) scale(0.98); }
  .cta:disabled { opacity: 0.55; cursor: default; transform: none; }

  .suggests { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .suggests .lead { font-size: 12.5px; color: var(--txt-3); letter-spacing: 0.06em; }
  .suggests .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 560px; }
  .chip {
    font-size: 13px; color: var(--txt-2);
    border: 1px solid var(--line); border-radius: 9999px;
    padding: 8px 16px; background: transparent;
    transition: background .15s ease, color .15s ease;
  }
  .chip:hover { background: var(--surface); color: var(--txt); }

  /* ===== 波形 ===== */
  #wave {
    display: none;
    width: 100%; max-width: 440px; height: 44px;
    margin-top: 8px;
  }
  #wave.show { display: block; }

  /* ===== 通话控制 ===== */
  .controls {
    display: none;
    margin-top: 26px;
    align-items: center; gap: 16px;
  }
  .controls.show { display: flex; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .ctl {
    width: 58px; height: 58px; border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface); color: var(--txt);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background .16s ease, transform .16s ease, border-color .16s ease;
  }
  .ctl:hover { background: var(--surface-hover); transform: translateY(-2px); }
  .ctl svg { width: 22px; height: 22px; }
  .ctl.muted { background: rgba(255, 255, 255, 0.9); color: #0a0a0d; border-color: transparent; }
  .ctl.end { background: rgba(255, 92, 92, 0.14); border-color: rgba(255, 92, 92, 0.35); color: var(--danger); }
  .ctl.end:hover { background: rgba(255, 92, 92, 0.24); }

  /* ===== 对话记录侧栏 ===== */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
    width: 380px; max-width: 92vw;
    background: rgba(14, 14, 19, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-left: 1px solid var(--line);
    transform: translateX(102%);
    transition: transform .32s cubic-bezier(0.3, 0.7, 0.3, 1);
    display: flex; flex-direction: column;
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    flex: none; height: 60px; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    font-size: 14px; font-weight: 600;
  }
  .panel-body {
    flex: 1; overflow-y: auto;
    padding: 20px; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin;
  }
  .panel-empty { margin: auto; font-size: 13px; color: var(--txt-3); }
  .msg {
    max-width: 86%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.6;
    animation: rise .22s ease;
  }
  .msg .who { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; color: var(--txt-3); margin-bottom: 3px; }
  .msg.assistant { background: var(--surface); align-self: flex-start; border-bottom-left-radius: 5px; }
  .msg.user {
    background: rgba(255, 255, 255, 0.92); color: #0a0a0d;
    align-self: flex-end; border-bottom-right-radius: 5px;
  }
  .msg.user .who { color: rgba(0, 0, 0, 0.45); text-align: right; }
  .scrim {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, 0.35);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  /* ===== 角落日志 ===== */
  .logwrap { position: fixed; left: 16px; bottom: 12px; z-index: 25; opacity: 0.35; transition: opacity .2s; }
  .logwrap:hover { opacity: 1; }
  .logwrap summary {
    cursor: pointer; list-style: none;
    font-size: 11px; color: var(--txt-3); letter-spacing: 0.05em;
  }
  .logwrap summary::-webkit-details-marker { display: none; }
  #log {
    position: absolute; left: 0; bottom: 22px;
    width: 360px; max-width: 78vw; max-height: 200px; overflow-y: auto;
    background: rgba(14, 14, 19, 0.95);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--txt-2); line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce) {
    .orb-core, .orb-sheen { animation: none; }
  }
  @media (max-width: 640px) {
    .stage { width: 172px; height: 172px; }
    .status { font-size: 15px; }
    .caption { font-size: 15px; }
    .arch-link { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span>超脑</div>
  <div class="top-right">
    <a class="arch-link" href="/architecture.html">架构分析 ↗</a>
    <button class="icon-btn" id="transcriptBtn" title="对话记录" aria-label="对话记录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </button>
  </div>
</header>

<main class="stage-area">
  <div class="stage off" id="stage">
    <div class="orb-glow" id="orbGlow"></div>
    <button class="orb-hit" id="orbBtn" aria-label="开始对话">
      <span class="orb-scale" id="orbScale">
        <span class="orb-core"></span>
        <span class="orb-sheen"></span>
      </span>
    </button>
  </div>

  <div class="status dim" id="status">和小超说说话</div>
  <div class="hint" id="statusHint">能查待办、检索知识库，难题会交给深度模型细想</div>

  <div class="caption" id="caption"></div>

  <div class="idle-actions" id="idleActions">
    <button class="cta" id="ctaBtn">开始对话</button>
    <div class="suggests">
      <span class="lead">接通后可以试着说</span>
      <div class="row">
        <span class="chip">我今天有什么待办</span>
        <span class="chip">wiki 里语音 agent 选型怎么说的</span>
        <span class="chip">深入想想双 LLM 架构</span>
      </div>
    </div>
  </div>

  <canvas id="wave"></canvas>

  <div class="controls" id="callControls">
    <button class="ctl" id="muteBtn" title="静音" aria-label="静音"></button>
    <button class="ctl end" id="endBtn" title="结束通话" aria-label="结束通话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="对话记录">
  <div class="panel-head">
    对话记录
    <button class="icon-btn" id="panelClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="panel-body" id="transcriptList">
    <div class="panel-empty">还没有对话内容</div>
  </div>
</aside>

<div class="logwrap">
  <details>
    <summary>日志</summary>
    <div id="log"></div>
  </details>
</div>

<script src="/node_modules/livekit-client/dist/livekit-client.umd.js"></script>
<script>
const stage = document.getElementById('stage');
const orbBtn = document.getElementById('orbBtn');
const orbScale = document.getElementById('orbScale');
const orbGlow = document.getElementById('orbGlow');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('statusHint');
const captionEl = document.getElementById('caption');
const idleActions = document.getElementById('idleActions');
const ctaBtn = document.getElementById('ctaBtn');
const controls = document.getElementById('callControls');
const muteBtn = document.getElementById('muteBtn');
const endBtn = document.getElementById('endBtn');
const waveEl = document.getElementById('wave');
const waveCtx = waveEl.getContext('2d');
const panel = document.getElementById('panel');
const scrim = document.getElementById('scrim');
const transcriptList = document.getElementById('transcriptList');
const logEl = document.getElementById('log');
const decoder = new TextDecoder();

let room = null, audioCtx = null, raf = null;
let micAnalyser = null, agentAnalyser = null, micBuf = null, agentBuf = null;
let muted = false, inCall = false;
let manualHangup = false, retryCount = 0, retryTimer = null;

/* ---- 图标 ---- */
const ICONS = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg>',
  micOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>',
};
function setIcon(el, name) { el.innerHTML = ICONS[name]; }
setIcon(muteBtn, 'mic');

const STATE_TEXT = {
  listening: '正在聆听',
  thinking: '正在思考',
  speaking: '',
  idle: '待机',
  initializing: '初始化',
};

function setStatus(text, dim) {
  statusEl.textContent = text;
  statusEl.className = dim ? 'status dim' : 'status';
}
function setHint(text) { hintEl.textContent = text || ''; }

/* ---- 字幕 & 记录 ---- */
function pushTranscript(role, text) {
  // 中央字幕：只保留最新一条
  captionEl.innerHTML = '';
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = role === 'user' ? '我' : '小超';
  captionEl.appendChild(who);
  captionEl.appendChild(document.createTextNode(text));

  // 侧栏记录
  const empty = transcriptList.querySelector('.panel-empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const w = document.createElement('span');
  w.className = 'who';
  w.textContent = role === 'user' ? '我' : '小超';
  d.appendChild(w);
  d.appendChild(document.createTextNode(text));
  transcriptList.appendChild(d);
  transcriptList.scrollTop = transcriptList.scrollHeight;
}

function handleAgentData(payload) {
  let msg;
  try { msg = JSON.parse(decoder.decode(payload)); } catch { return; }
  if (msg.type === 'agent_state') {
    stage.classList.toggle('thinking', msg.state === 'thinking');
    if (msg.state === 'speaking') {
      setStatus('小超说话中', false);
      setHint('可以直接插话打断');
    } else {
      setStatus(STATE_TEXT[msg.state] || msg.state, msg.state === 'idle');
    }
  } else if (msg.type === 'user_state' && msg.state === 'speaking') {
    setStatus('正在听你讲', false);
  } else if (msg.type === 'transcript' && msg.text) {
    pushTranscript(msg.role === 'user' ? 'user' : 'assistant', msg.text);
  }
}

function log(msg) {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  logEl.prepend(d);
}

/* ---- 音频分析：麦克风 + 助手远端音频，谁响用谁 ---- */
function makeAnalyser(stream) {
  const src = audioCtx.createMediaStreamSource(stream);
  const an = audioCtx.createAnalyser();
  an.fftSize = 64;
  an.smoothingTimeConstant = 0.8;
  src.connect(an);
  return { analyser: an, buf: new Uint8Array(an.frequencyBinCount) };
}

function drawWave(buf) {
  const dpr = window.devicePixelRatio || 1;
  const w = waveEl.clientWidth, h = waveEl.clientHeight;
  if (waveEl.width !== w * dpr || waveEl.height !== h * dpr) {
    waveEl.width = w * dpr;
    waveEl.height = h * dpr;
  }
  waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  waveCtx.clearRect(0, 0, w, h);
  const BARS = 32;
  const gap = 5;
  const barW = (w - gap * (BARS - 1)) / BARS;
  const step = Math.max(1, Math.floor(buf.length / BARS));
  for (let i = 0; i < BARS; i++) {
    const v = buf[Math.min(buf.length - 1, i * step)] / 255;
    const bh = Math.max(3, v * h);
    const x = i * (barW + gap);
    const y = (h - bh) / 2;
    const r = Math.min(barW / 2, bh / 2);
    waveCtx.fillStyle = v > 0.04 ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.16)';
    waveCtx.beginPath();
    if (waveCtx.roundRect) waveCtx.roundRect(x, y, barW, bh, r);
    else waveCtx.rect(x, y, barW, bh);
    waveCtx.fill();
  }
}

function startVisuals() {
  (function tick() {
    let energy = 0, activeBuf = null;
    if (agentAnalyser) {
      agentAnalyser.analyser.getByteFrequencyData(agentAnalyser.buf);
      const avg = agentAnalyser.buf.reduce((a, b) => a + b, 0) / agentAnalyser.buf.length / 255;
      if (avg > energy) { energy = avg; activeBuf = agentAnalyser.buf; }
    }
    if (micAnalyser) {
      micAnalyser.analyser.getByteFrequencyData(micAnalyser.buf);
      const avg = micAnalyser.buf.reduce((a, b) => a + b, 0) / micAnalyser.buf.length / 255;
      if (avg > energy) { energy = avg; activeBuf = micAnalyser.buf; }
    }
    orbScale.style.transform = `scale(${1 + energy * 0.15})`;
    orbGlow.style.opacity = 0.4 + energy * 0.55;
    orbGlow.style.transform = `scale(${1 + energy * 0.2})`;
    if (activeBuf) drawWave(activeBuf);
    raf = requestAnimationFrame(tick);
  })();
}

function stopVisuals() {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  micAnalyser = null; agentAnalyser = null;
  if (audioCtx) audioCtx.close();
  audioCtx = null;
  orbScale.style.transform = '';
  orbGlow.style.opacity = '';
  orbGlow.style.transform = '';
  waveCtx.clearRect(0, 0, waveEl.width, waveEl.height);
}

/* ---- 通话状态机 ---- */
function setCallState(state) {
  // idle | connecting | live
  stage.classList.toggle('connecting', state === 'connecting');
  stage.classList.toggle('off', state === 'idle');
  if (state === 'live') {
    inCall = true;
    idleActions.classList.add('hidden');
    controls.classList.add('show');
    waveEl.classList.add('show');
  } else {
    inCall = false;
    idleActions.classList.remove('hidden');
    controls.classList.remove('show');
    waveEl.classList.remove('show');
    muted = false;
    muteBtn.classList.remove('muted');
    setIcon(muteBtn, 'mic');
    ctaBtn.disabled = false;
    ctaBtn.textContent = state === 'connecting' ? '连接中…' : '开始对话';
    ctaBtn.disabled = state === 'connecting';
  }
}

async function connect() {
  setCallState('connecting');
  setStatus('正在连接', true);
  setHint('');
  try {
    const roomName = 'voice-demo-' + Math.random().toString(36).slice(2, 6);
    const res = await fetch('/token?room=' + roomName + '&identity=' + encodeURIComponent('web-' + Math.random().toString(36).slice(2, 6)));
    const { token, url } = await res.json();

    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === 'audio') {
        track.attach();
        log('已订阅助手音频轨');
        setStatus('小超已上线', false);
        setHint('直接说话即可');
        // 分析助手音频，让球随小超说话律动
        if (audioCtx && track.mediaStreamTrack) {
          try { agentAnalyser = makeAnalyser(new MediaStream([track.mediaStreamTrack])); } catch (e) { log('agent analyser: ' + e.message); }
        }
      }
    });
    room.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => {
      log('参与者加入: ' + p.identity);
      setStatus('小超已上线', false);
      setHint('直接说话即可');
    });
    room.on(LivekitClient.RoomEvent.DataReceived, (payload) => handleAgentData(payload));
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      stopVisuals();
      setCallState('idle');
      room = null;
      if (!manualHangup && retryCount < 3) {
        retryCount++;
        setStatus(`连接断开，${2 * retryCount} 秒后自动重连`, true);
        setHint(`第 ${retryCount} 次重试`);
        log('连接断开，自动重连中…');
        retryTimer = setTimeout(() => connect(), 2000 * retryCount);
      } else {
        setStatus(manualHangup ? '已结束，下次再聊' : '连接断开，请重新开始', true);
        setHint(manualHangup ? '' : '点击开始对话重试');
        stage.classList.add('off');
      }
    });

    await room.connect(url, token);
    log('已连接房间 ' + roomName);
    await room.localParticipant.setMicrophoneEnabled(true);
    log('麦克风已开启');

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const micPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Microphone);
    if (micPub && micPub.track && micPub.track.mediaStreamTrack) {
      micAnalyser = makeAnalyser(new MediaStream([micPub.track.mediaStreamTrack]));
    }
    startVisuals();

    setStatus('小超正在赶来', true);
    setHint('通常只要一两秒');
    retryCount = 0;
    setCallState('live');
  } catch (e) {
    setStatus('连接失败: ' + e.message, true);
    setCallState('idle');
    log('连接失败: ' + e.message);
  }
}

function hangup() {
  manualHangup = true;
  if (room) room.disconnect();
}

ctaBtn.addEventListener('click', () => {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  manualHangup = false; retryCount = 0;
  connect();
});
orbBtn.addEventListener('click', () => {
  if (!inCall && !stage.classList.contains('connecting')) ctaBtn.click();
});
endBtn.addEventListener('click', hangup);

muteBtn.addEventListener('click', async () => {
  if (!room) return;
  muted = !muted;
  await room.localParticipant.setMicrophoneEnabled(!muted);
  muteBtn.classList.toggle('muted', muted);
  setIcon(muteBtn, muted ? 'micOff' : 'mic');
  log(muted ? '已静音' : '已取消静音');
});

/* ---- 对话记录面板 ---- */
function togglePanel(open) {
  panel.classList.toggle('open', open);
  scrim.classList.toggle('show', open);
}
document.getElementById('transcriptBtn').addEventListener('click', () => togglePanel(!panel.classList.contains('open')));
document.getElementById('panelClose').addEventListener('click', () => togglePanel(false));
scrim.addEventListener('click', () => togglePanel(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') togglePanel(false); });
</script>
</body>
